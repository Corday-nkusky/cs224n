<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>CS224N 学习路径</title>
<meta name="description" content="CS224N 沉浸式交互学习路径。双击打开，离线可用。">
<style>
/* ==== 内联自 assets/k01.css ==== */
/* ================================================================
   CS224N K01 沉浸式课程流 · 共享样式
   ================================================================ */

/* ---- 变量 ---- */
:root {
  --bg-0: #0b1020;
  --bg-1: #0f172a;
  --bg-2: #162032;
  --bg-3: rgba(30,41,59,0.65);
  --fg: #e2e8f0;
  --fg-2: #94a3b8;
  --fg-3: #64748b;
  --accent: #38bdf8;
  --accent-2: #818cf8;
  --ok: #34d399;
  --warn: #fbbf24;
  --err: #f87171;
  --border: rgba(148,163,184,0.12);
  --radius: 14px;
  --shadow: 0 10px 30px rgba(0,0,0,0.35);
}
html[data-theme="light"] {
  --bg-0: #f8fafc;
  --bg-1: #ffffff;
  --bg-2: #f1f5f9;
  --bg-3: rgba(241,245,249,0.85);
  --fg: #0f172a;
  --fg-2: #475569;
  --fg-3: #94a3b8;
  --border: rgba(148,163,184,0.25);
  --shadow: 0 10px 30px rgba(0,0,0,0.08);
}

/* ---- 全局 ---- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background: var(--bg-0);
  color: var(--fg);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height:1.6;
  overflow-x:hidden;
  transition: background .3s, color .3s;
}
button{font-family:inherit}

/* ---- 顶部导航 ---- */
.top-nav{
  position:fixed; inset:0 0 auto 0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 20px;
  background: linear-gradient(180deg, var(--bg-1) 60%, transparent);
  pointer-events:none;
}
.top-nav > *{pointer-events:auto}
.brand{
  display:flex; align-items:center; gap:10px;
  text-decoration:none; color: var(--fg);
}
.brand-mark{
  width:34px; height:34px; border-radius:10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display:grid; place-items:center; font-weight:800; color:#fff; font-size:14px;
}
.brand-text{ font-weight:700; letter-spacing:.2px;}
.brand-text small{ display:block; color:var(--fg-3); font-size:11px; font-weight:500; margin-top:-2px}
.nav-right{ display:flex; align-items:center; gap:10px;}
.nav-btn{
  background: var(--bg-3);
  border:1px solid var(--border);
  color: var(--fg-2);
  border-radius:10px; padding:8px 12px; cursor:pointer; font-size:13px;
  backdrop-filter: blur(8px);
  transition: transform .15s, background .2s;
}
.nav-btn:hover{ background: var(--bg-2); color: var(--fg);}

/* ---- 进度 ---- */
.progress-wrap{ display:flex; align-items:center; gap:10px;}
.progress-track{
  width:120px; height:6px; border-radius:3px; background: var(--bg-2); overflow:hidden;
}
.progress-fill{ height:100%; width:0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:3px; transition: width .4s ease;}
.progress-label{ font-size:12px; color:var(--fg-3); min-width:58px; text-align:right;}

/* ---- 场景容器 ---- */
.scene-container{ position:relative;}
.scene{
  display:none;
  padding: 90px 22px 120px;
  max-width: 980px; margin: 0 auto;
  animation: fadeUp .55s ease both;
}
.scene.active{ display:block;}
@keyframes fadeUp {
  from { opacity:0; transform: translateY(18px);}
  to   { opacity:1; transform: translateY(0);}
}

/* ---- 场景公共头 ---- */
.scene-header{ margin-bottom: 28px;}
.step-label{ display:inline-block; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); background: linear-gradient(90deg, rgba(56,189,248,.12), rgba(129,140,248,.12)); padding:4px 10px; border-radius:20px; margin-bottom:10px;}
.scene-title{ font-size: clamp(26px, 4.5vw, 38px); font-weight:800; line-height:1.15; margin:0 0 10px; letter-spacing:-.02em;}
.scene-lead{ font-size:18px; color:var(--fg-2); max-width: 720px; margin:0;}

/* ---- 卡片 ---- */
.card{
  background: var(--bg-3);
  border:1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  margin: 18px 0;
  backdrop-filter: blur(10px);
  box-shadow: var(--shadow);
  transition: background .3s, border-color .3s;
}
.card > :first-child{ margin-top:0;}
.card > :last-child{ margin-bottom:0;}

/* ---- 布局工具 ---- */
.grid-2{ display:grid; grid-template-columns: repeat(2, 1fr); gap:16px;}
.grid-3{ display:grid; grid-template-columns: repeat(3, 1fr); gap:16px;}
@media (max-width: 860px){ .grid-2, .grid-3{ grid-template-columns: 1fr;}}

/* ---- 按钮 ---- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background: var(--bg-2); color: var(--fg); border:1px solid var(--border);
  border-radius: 12px; padding: 10px 18px; cursor:pointer; font-size:14px; font-weight:600;
  transition: transform .12s, background .2s, box-shadow .2s;
}
.btn:hover{ transform: translateY(-1px); background: var(--bg-3);}
.btn:active{ transform: translateY(0);}
.btn-primary{ background: linear-gradient(135deg, var(--accent), var(--accent-2)); color:#062c36; border:none;}
.btn-primary:hover{ filter: brightness(1.08);}
.btn-large{ padding: 14px 28px; font-size:16px; border-radius:14px;}
.btn-ghost{ background: transparent;}

/* ---- 底部场景导航 ---- */
.scene-footer{
  position:fixed; inset: auto 0 0 0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding: 14px 20px 18px;
  background: linear-gradient(0deg, var(--bg-1) 60%, transparent);
  pointer-events:none;
}
.scene-footer > *{ pointer-events:auto;}
.dots{ display:flex; gap:8px;}
.dot{
  width:10px; height:10px; border-radius:50%; background: var(--fg-3); opacity:.35; cursor:pointer; transition: .25s;
}
.dot.active{ opacity:1; background: var(--accent); transform: scale(1.15);}

/* ---- 封面特殊 ---- */
.scene-cover{ text-align:center; padding-top: 120px;}
.cover-badge{ display:inline-block; font-size:12px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:var(--accent-2); border:1px solid var(--border); padding:6px 14px; border-radius:20px; margin-bottom:18px;}
.cover-title{ font-size: clamp(34px, 6vw, 60px); font-weight:900; line-height:1.05; margin:0 auto 16px; max-width: 900px; letter-spacing:-.03em; background: linear-gradient(135deg, var(--fg) 60%, var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
.cover-lead{ font-size: clamp(16px, 2.2vw, 22px); color:var(--fg-2); max-width: 640px; margin: 0 auto 28px;}
.cover-meta{ color:var(--fg-3); font-size:14px; margin-bottom:32px;}
.scene-map{ display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:12px; max-width: 860px; margin: 40px auto 0; text-align:left;}
.map-card{
  background: var(--bg-3); border:1px solid var(--border); border-radius:12px; padding:14px; cursor:pointer; transition:.2s;
}
.map-card:hover{ border-color: var(--accent); transform: translateY(-2px);}
.map-card .num{ font-size:12px; color:var(--accent); font-weight:700;}
.map-card .ttl{ font-size:13px; font-weight:600; margin-top:4px;}
.map-card.locked{ opacity:.5; cursor:not-allowed;}

/* ---- 交互组件：滑块 ---- */
.slider-wrap{ display:flex; align-items:center; gap:14px; margin: 12px 0;}
.slider-wrap input[type=range]{ flex:1; accent-color: var(--accent);}
.slider-val{ min-width:40px; text-align:center; font-weight:700; color:var(--accent); font-variant-numeric: tabular-nums;}

/* ---- 交互组件：矩阵 ---- */
.matrix-wrap{ overflow:auto; margin: 10px 0;}
.matrix{ display:grid; gap:3px; font-size:13px; font-variant-numeric: tabular-nums;}
.matrix .cell{
  background: var(--bg-2); border-radius:6px; padding:6px 8px; text-align:center; min-width:36px; transition:.15s;
}
.matrix .cell.head{ background: transparent; color:var(--fg-3); font-weight:600; font-size:12px;}
.matrix .cell.on{ background: rgba(56,189,248,.18); color: var(--accent); font-weight:700;}
.matrix .cell.sel{ outline: 2px solid var(--accent); }

/* ---- 交互组件：词云/语料 ---- */
.corpus-line{ display:flex; flex-wrap:wrap; gap:8px; margin: 14px 0;}
.token{
  background: var(--bg-2); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:14px; font-weight:600; transition:.25s; cursor:default;
}
.token.center{ background: rgba(56,189,248,.2); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,.12);}
.token.context{ background: rgba(129,140,248,.18); border-color: var(--accent-2); color: var(--accent-2);}

/* ---- 交互组件：条形图 ---- */
.bars{ display:flex; align-items:flex-end; gap:10px; height:160px; padding:10px 0;}
.bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;}
.bar-track{ width:100%; background: var(--bg-2); border-radius:8px 8px 0 0; position:relative; overflow:hidden;}
.bar-fill{ position:absolute; bottom:0; left:0; right:0; border-radius:8px 8px 0 0; background: linear-gradient(180deg, var(--accent), var(--accent-2)); transition: height .6s cubic-bezier(.34,1.56,.64,1);}
.bar-label{ font-size:12px; color:var(--fg-3); text-align:center;}
.bar-num{ font-size:13px; font-weight:700; color:var(--fg);}

/* ---- 交互组件：散点 ---- */
.scatter-box{ position:relative; width:100%; height:280px; background: var(--bg-2); border-radius:12px; border:1px solid var(--border); overflow:hidden;}
.scatter-point{ position:absolute; transform:translate(-50%,-50%); width:10px; height:10px; border-radius:50%; background: var(--accent); transition: left .4s, top .4s;}
.scatter-label{ position:absolute; transform:translate(-50%,-120%); font-size:11px; color:var(--fg-2); white-space:nowrap; pointer-events:none;}

/* ---- 测验 ---- */
.quiz-opt{ display:flex; align-items:center; gap:10px; background: var(--bg-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin:8px 0; cursor:pointer; transition:.15s;}
.quiz-opt:hover{ border-color: var(--accent-2);}
.quiz-opt.correct{ border-color: var(--ok); background: rgba(52,211,153,.08);}
.quiz-opt.wrong{ border-color: var(--err); background: rgba(248,113,113,.08);}
.quiz-opt input{ accent-color: var(--accent);}

/* ---- 公式块 ---- */
.katex-display{ margin: 14px 0; overflow-x:auto;}

/* ---- 杂项 ---- */
.tag{ display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; background: rgba(56,189,248,.12); color: var(--accent); margin-right:6px;}
.tag.ok{ background: rgba(52,211,153,.12); color: var(--ok);}
.tag.warn{ background: rgba(251,191,36,.12); color: var(--warn);}
.tag.err{ background: rgba(248,113,113,.12); color: var(--err);}

.callout{ border-left: 3px solid var(--accent); padding-left:14px; margin: 14px 0; color: var(--fg-2);}
.callout.warn{ border-color: var(--warn);}
.callout.err{ border-color: var(--err);}

.hidden{ display:none !important;}

/* ---- 推导步进器 ---- */
.stepper ol{ margin:10px 0 0; padding-left:22px;}
.stepper .step{ display:none; margin:8px 0; line-height:1.7;}
.stepper .step.show{ display:list-item; animation: fadeUp .35s ease both;}
.stepper .step .formula{ margin:8px 0;}

/* ---- 数值表 ---- */
table.num{ width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:14px; margin:10px 0;}
table.num th, table.num td{ padding:7px 12px; border-bottom:1px solid var(--border); text-align:right;}
table.num th:first-child, table.num td:first-child{ text-align:left;}
table.num th{ color:var(--fg-3); font-size:12px; text-transform:uppercase; letter-spacing:.05em;}

/* ---- 数学高亮 ---- */
.msym{ font-family: Georgia, "Times New Roman", serif; font-style: italic;}
.formula.small{ font-size:15px; padding:10px;}

/* ---- 滚动条 ---- */
::-webkit-scrollbar{ width:8px; height:8px;}
::-webkit-scrollbar-track{ background: transparent;}
::-webkit-scrollbar-thumb{ background: var(--fg-3); border-radius:4px;}
</style>
<style>
.hero{ text-align:center; padding: 120px 22px 60px;}
.hero-num{
  font-family: Georgia, "Times New Roman", serif;

  color: transparent; -webkit-text-stroke: 2px rgba(148,163,184,.35);

}
.path{ max-width: 760px; margin: 40px auto 120px; padding: 0 22px; position:relative;}

}
.node .body{ flex:1; padding-top:4px;}
.node .body h3{ margin:0 0 4px; font-size:18px;}
.node .body p{ margin:0; font-size:14px; color:var(--fg-2);}
.node .meta{ font-size:12px; color:var(--fg-3); margin-top:6px;}
.node a.card-link{ text-decoration:none; color:inherit; display:block; border-radius:12px; transition:.2s;}
.node.open a.card-link:hover h3{ color: var(--accent);}

.badge-done{ color: var(--ok); font-weight:700; font-size:13px;}

</style>
<style>

/* ============================================================
 * 手机端补丁（build_mobile.py 注入，只存在于单文件版）
 * 1) iOS 横屏自动放大字号 —— 关掉
 * 2) 刘海 / 底部手势条 —— 固定栏与正文避开安全区
 * 3) 手指点不准 —— 抬高按钮、选项、滑块的触摸区
 * 4) 顶/底固定栏的毛玻璃 —— iOS Safari 要 -webkit- 前缀
 * 5) 窄屏溢出 —— 表格、SVG 图、矩阵自己横向滚，不许带着整页滚
 * ========================================================== */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { overflow-wrap: break-word; }

/* 固定栏毛玻璃前缀 */
.top-nav, .scene-footer, .card, .nav-btn { -webkit-backdrop-filter: blur(10px); }

/* 安全区：刘海屏不被盖、底部留出手势条 */
@supports (padding: max(0px)) {
  .top-nav {
    padding-top: max(10px, env(safe-area-inset-top));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  .scene-footer {
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  .scene {
    padding-left: max(14px, env(safe-area-inset-left));
    padding-right: max(14px, env(safe-area-inset-right));
  }
}

/* 手指友好的最小点击区 */
.btn, .nav-btn, .quiz-opt, .map-card, select, input[type=range] { min-height: 44px; }
.slider-wrap input[type=range] { padding: 12px 0; }
.dot { width: 13px; height: 13px; }
.dots { gap: 10px; }

@media (max-width: 860px) {
  .scene { padding: 78px 14px 112px; }
  .card { padding: 15px; }
  .scene-title { line-height: 1.2; }
  .cover-title { line-height: 1.1; }

  /* 表格在窄屏自己横向滚 */
  table.num, table.cmp { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* 内联 SVG 图：保证最小可读宽度，超出部分让它自己滚 */
  .fig { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .fig svg { min-width: 460px; }

  /* 矩阵 / 条形图 / 代码块 */
  .matrix-wrap, .bars, pre { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* 统计块两列排（若页面用了 4 列 1fr 的 stat-row） */
  .stat-row { grid-template-columns: 1fr 1fr; gap: 10px; }

  /* 顶栏：手机上收起副标题，标题单行省略，别挤成两行 */
  .top-nav { gap: 8px; }
  .brand-text small { display: none; }
  .brand-text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}

@media print { .top-nav, .scene-footer { display: none !important; } }

</style>
</head>

<header class="hero">
  <div class="cover-badge">Stanford CS224N · 自学重构版</div>
  <div class="hero-num">CS224N</div>
  <h1 class="cover-title">用交互把 NLP 学进手里</h1>
  <p class="cover-lead">每一章 = 一条 10 场景的沉浸课程流：问题 → 直觉 → 动手实验 → 机制 → 检验。<br>所有数字来自本机实跑，不联网，双击即学。</p>

<script>
(function () {
  var CH = [
    { id: 'K01', title: '词向量与分布语义', desc: 'one-hot 为什么死、分布假说、共现矩阵 + SVD、word2vec、负采样与哈夫曼。', url: 'k01.html', open: true, meta: '10 场景 · 11 个交互实验 · 对接 A1' },
    { id: 'A1', title: '作业 A1 · 词向量实战', desc: '亲手写共现矩阵 + TruncatedSVD + GloVe 分析。', url: 'a1.html', open: true, meta: '轮椅页 · 10 场景 · 四函数提示阶梯' },
    { id: 'K02', title: '神经网络与反向传播', desc: '计算图求导、两层 MLP 白纸手推（第一道闸门）。', url: 'k02.html', open: true, meta: '10 场景 · 闸门 1 推导 · 对接 A2/T2' },
    { id: 'A2', title: '作业 A2 · 依存句法分析', desc: 'tensor 求导书面题 + transition-based parser。', locked: true },
    { id: 'K03', title: '语言模型与 RNN', desc: 'n-gram → RNN → 梯度消失。', url: 'k03.html', open: true, meta: '10 场景 · 7 个交互实验 · 对接 T2 A4/A5' },
    { id: 'K04', title: '注意力与 Transformer', desc: '不查资料默画结构并标张量形状（第二道闸门）。', locked: true },
    { id: 'A3', title: '作业 A3 · 从零写 GPT', desc: '6 处 TODO，对 snapshot 全绿 + loss 真下降。', locked: true },
    { id: 'K05', title: '预训练', desc: 'BERT / GPT 范式。', locked: true },
    { id: 'K06', title: '后训练', desc: 'SFT → RLHF → DPO。', locked: true },
    { id: 'K07', title: 'PEFT 与 LoRA', desc: '低秩适配。', locked: true },
    { id: 'K08', title: 'RAG 与 Agent', desc: '检索增强与工具调用。', locked: true },
    { id: 'K09', title: '评测', desc: '基准、LLM-as-judge。', locked: true },
    { id: 'A4', title: '作业 A4 · 评测与 red team', desc: 'API 评测实战（有降级方案）。', locked: true },
    { id: 'K10', title: '推理模型', desc: 'o1/R1 式长链推理。', locked: true },
    { id: 'K11', title: '分词与多语言', desc: 'BPE 与跨语言迁移。', locked: true },
    { id: 'K12', title: '影响与开放问题', desc: '前沿 6 主题（第三道闸门）。', locked: true }
  ];
  var path = document.getElementById('path');
  CH.forEach(function (c, i) {
    var node = document.createElement('div');
    node.className = 'node ' + (c.open ? 'open' : 'locked');
    var pin = '<div class="pin">' + c.id.replace(/[KA]/, '') + '</div>';
    var inner = '<div class="body"><h3>' + c.id + ' · ' + c.title + '</h3><p>' + c.desc + '</p>' +
      '<div class="meta">' + (c.open ? (c.meta || '') : '未解锁') + '</div></div>';
    if (c.open) {
      node.innerHTML = pin + '<a class="card-link" href="' + c.url + '">' + inner + '</a>';
    } else {
      node.innerHTML = pin + inner;
    }
    path.appendChild(node);
  });

  // 进度卡
  try {
    var s = JSON.parse(localStorage.getItem('cs224n_k01_v2') || '{}');
    var n = 0;
    Object.keys(s.checks || {}).forEach(function (k) { if (s.checks[k]) n++; });
    Object.keys(s.quiz || {}).forEach(function (k) { if (s.quiz[k] === true) n++; });
    if (s.tasks && s.tasks._point) n++;
    if (s.selftest && s.selftest._point) n++;
    if (n > 0) {
      document.getElementById('progressCard').textContent = 'K01 进行中：已得 ' + n + ' / 14 分 —— 继续 → k01.html';
    }
  } catch (e) {}

  // 主题
  var btn = document.getElementById('themeBtn');
  function apply(t) {
    document.documentElement.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☾ 浅色' : '☀ 深色';
  }
  apply(localStorage.getItem('k01_theme') || 'dark');
  btn.addEventListener('click', function () {
    var nxt = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(nxt); localStorage.setItem('k01_theme', nxt);
  });
})();
</script>
</body>
</html>
